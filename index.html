<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Courage Glass Squish Studio — 3D Creation</title>
  <style>
    :root {
      --bg: #111318;
      --card: #191d26;
      --border: #2c3345;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f472b6;
      --accent-soft: rgba(244, 114, 182, 0.16);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app { display: flex; flex-direction: column; width: 100%; height: 100dvh; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 6px; padding: 8px 10px; background: var(--card); border-bottom: 1px solid var(--border);
      font-size: 12px; z-index: 10;
    }
    .btn-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    button {
      appearance: none; border: 1px solid var(--border); background: #232938; color: var(--text);
      padding: 5px 9px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    button.active {
      border-color: var(--accent); background: var(--accent-soft); color: #fbcfe8;
    }
    .toggle-label {
      display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted);
      cursor: pointer; user-select: none; margin-left: 2px;
    }
    .toggle-label input { accent-color: var(--accent); width: 15px; height: 15px; }
    .viewport {
      position: relative; flex: 1; min-height: 0; width: 100%; overflow: hidden;
      background: linear-gradient(180deg, #e3dcd1 0%, #cfc6b8 100%);
    }
    #threeCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud-badge {
      position: absolute; top: 10px; left: 10px; padding: 4px 8px; border-radius: 6px;
      background: rgba(17, 19, 24, 0.80); border: 1px solid rgba(255,255,255,0.14); color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
      pointer-events: none; backdrop-filter: blur(6px);
    }
    .hud-dims {
      position: absolute; bottom: 10px; right: 10px; padding: 4px 8px; border-radius: 6px;
      background: rgba(17, 19, 24, 0.80); border: 1px solid rgba(255,255,255,0.14); color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
      pointer-events: none; backdrop-filter: blur(6px);
    }
    .err-banner {
      display: none; position: absolute; inset: 16px; padding: 14px; border-radius: 10px;
      background: rgba(127, 29, 29, 0.92); color: #fee2e2; font-size: 13px; z-index: 50;
    }
    .controls {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 8px; z-index: 10;
      max-height: 44dvh; overflow-y: auto;
    }
    .primary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) { .primary-grid { grid-template-columns: 1fr; } }
    .slider-card {
      background: #12151e; border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px;
    }
    .slider-card.highlight { border-color: rgba(244, 114, 182, 0.55); }
    .slider-head {
      display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 3px;
    }
    .slider-head label { font-weight: 600; }
    .slider-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--accent);
    }
    input[type="range"] {
      width: 100%; accent-color: var(--accent); height: 22px; margin: 0; cursor: pointer;
    }
    .secondary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    @media (max-width: 640px) { .secondary-grid { grid-template-columns: repeat(2, 1fr); } }
    .mini-card {
      background: #12151e; border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
    }
    .mini-card .slider-head { font-size: 11px; margin-bottom: 2px; }
    .mini-card .slider-head label { font-weight: 500; color: var(--muted); }
    .mini-card .slider-val { color: var(--text); font-size: 11px; }
    .footer-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted);
    }
    #copyBtn {
      background: var(--accent-soft); border-color: var(--accent); color: #fbcfe8; font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="btn-group">
        <button data-preset="boop" class="preset-btn">Boop</button>
        <button data-preset="classic" class="preset-btn active">Classic</button>
        <button data-preset="pancake" class="preset-btn">Squishy Toy</button>
        <button data-preset="extreme" class="preset-btn">Extreme</button>
      </div>
      <div class="btn-group">
        <button id="camFront">Front</button>
        <button id="camAngle">Angle</button>
        <button id="camSide">Side</button>
        <label class="toggle-label">
          <input id="toggleGlass" type="checkbox" checked />
          <span>Glass</span>
        </label>
      </div>
    </div>

    <div class="viewport">
      <canvas id="threeCanvas"></canvas>
      <div id="contactBadge" class="hud-badge">Glass Z: 34.0 mm</div>
      <div id="dimsReadout" class="hud-dims">--</div>
      <div id="errBanner" class="err-banner"></div>
    </div>

    <div class="controls">
      <div class="primary-grid">
        <div class="slider-card highlight">
          <div class="slider-head">
            <label for="glassZ">Move Glass Panel (Z)</label>
            <span id="glassZVal" class="slider-val">34.0 mm</span>
          </div>
          <input id="glassZ" type="range" min="20" max="75" step="0.5" value="34.0" />
        </div>
        <div class="slider-card highlight">
          <div class="slider-head">
            <label for="bulgeFactor">Squishiness (Wide Spread)</label>
            <span id="bulgeFactorVal" class="slider-val">1.45x</span>
          </div>
          <input id="bulgeFactor" type="range" min="0.0" max="2.4" step="0.05" value="1.45" />
        </div>
      </div>

      <div class="secondary-grid">
        <div class="mini-card">
          <div class="slider-head">
            <label for="rolloverBulge">Rim Bulge</label>
            <span id="rolloverBulgeVal" class="slider-val">9.5</span>
          </div>
          <input id="rolloverBulge" type="range" min="0" max="18" step="0.5" value="9.5" />
        </div>
        <div class="mini-card">
          <div class="slider-head">
            <label for="cheekPuff">Cheek Puff</label>
            <span id="cheekPuffVal" class="slider-val">14.0</span>
          </div>
          <input id="cheekPuff" type="range" min="0" max="26" step="0.5" value="14.0" />
        </div>
        <div class="mini-card">
          <div class="slider-head">
            <label for="jowlSag">Jowl Sag</label>
            <span id="jowlSagVal" class="slider-val">7.0</span>
          </div>
          <input id="jowlSag" type="range" min="0" max="15" step="0.5" value="7.0" />
        </div>
        <div class="mini-card">
          <div class="slider-head">
            <label for="preloadScale">Squash Zone</label>
            <span id="preloadScaleVal" class="slider-val">0.92</span>
          </div>
          <input id="preloadScale" type="range" min="0.6" max="1.05" step="0.01" value="0.92" />
        </div>
      </div>

      <div class="footer-row">
        <span>1-finger drag: orbit · 2-finger pinch: zoom</span>
        <button id="copyBtn">Copy Settings</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('error', (ev) => {
      const el = document.getElementById('errBanner');
      if (el) { el.style.display = 'block'; el.textContent = 'Viewer error: ' + (ev.message || 'Failed to load Three.js'); }
    });
  </script>

      const bin = atob(MESH_B64);

      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const dv = new DataView(bytes.buffer);

      const vertCount = dv.getUint16(0, true);

        const ax = basePos[i1 * 3] - basePos[i0 * 3], ay = basePos[i1 * 3 + 1] - basePos[i0 * 3 + 1], az = basePos[i1 * 3 + 2] - basePos[i0 * 3 + 2];
        const bx = basePos[i2 * 3] - basePos[i0 * 3], by = basePos[i2 * 3 + 1] - basePos[i0 * 3 + 1], bz = basePos[i2 * 3 + 2] - basePos[i0 * 3 + 2];
        const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
        baseNorm[i0 * 3] += nx; baseNorm[i0 * 3 + 1] += ny; baseNorm[i0 * 3 + 2] += nz;
        baseNorm[i1 * 3] += nx; baseNorm[i1 * 3 + 1] += ny; baseNorm[i1 * 3 + 2] += nz;
        baseNorm[i2 * 3] += nx; baseNorm[i2 * 3 + 1] += ny; baseNorm[i2 * 3 + 2] += nz;

        const l = Math.hypot(x, y, z) || 1.0;
        baseNorm[i * 3] = x / l; baseNorm[i * 3 + 1] = y / l; baseNorm[i * 3 + 2] = z / l;

      function eqSoftZ(x0, y0, z0, preload, nz) {
        const zn = Math.max(0.0, z0);
        let zSoft = zn > 46.0 ? 46.0 + (zn - 46.0) * 0.40 : zn;
        const pouchMask = smoothstep(75,105,zn) * smoothstep(-54,-38,y0) * (1-smoothstep(-8,2,y0)) * smoothstep(10,22,Math.abs(x0)) * (1-smoothstep(40,54,Math.abs(x0))) * smoothstep(0,0.35,nz);
        zSoft += 4.5 * pouchMask;
        const eyeBand = smoothstep(38,50,zn) * smoothstep(-4,2,y0) * (1-smoothstep(16,25,y0));
        const rl = Math.pow((x0+20.5)/13.5,2) + Math.pow((y0-6.5)/14.5,2);
        const rr = Math.pow((x0-24.5)/13.5,2) + Math.pow((y0-7.5)/14.5,2);
        zSoft += 5.5 * eyeBand * (Math.exp(-0.7*rl) + Math.exp(-0.7*rr));
        return zSoft * preload;
      }

      const state = {
        glassZ: 34.0,
        bulge: 1.45,
        rollover: 9.5,
        cheekPuff: 14.0,
        jowlSag: 7.0,
        preload: 0.92,
        showGlass: true,
      };

      function updateScene() {
        const gz = state.glassZ;
        const rDepth = 18.0;
        const rAmp = state.rollover * state.bulge;
        const noseTipEq = eqSoftZ(0, -23.5, 125.5, state.preload, 1.0);
        const normSnout = Math.min(2.4, Math.max(0, noseTipEq - gz) / 16.0);
        const crownEq = eqSoftZ(0, 10.0, 59.5, state.preload, 1.0);
        const normHead = Math.min(2.2, Math.max(0, crownEq - gz) / 14.0);
        const cushionBand = 1.6;

        let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, maxZ = 0;

        for (let i = 0; i < vertCount; i++) {
          const x0 = basePos[i*3], y0 = basePos[i*3+1], z0 = basePos[i*3+2];
          const nz = baseNorm[i*3+2];
          let zEq = eqSoftZ(x0, y0, z0, state.preload, nz);

          const wOver = smoothstep(-6.0, -18.0, y0);
          const uUnder = smoothstep(0.24, -0.55, nz) * wOver;
          zEq -= 12.0 * Math.pow(uUnder, 1.25);
          const zCeil = gz - 18.5 * Math.pow(uUnder, 1.45);
          const zKnee = zCeil - cushionBand;

          let zFinal;
          if (zEq <= zKnee) {
            zFinal = zEq;
          } else {
            const ok = zEq - zKnee;
            zFinal = zKnee + cushionBand * (ok / (ok + cushionBand));
          }

          const rearLock = smoothstep(0.0, 4.5, z0);
          zFinal = Math.min(gz, Math.max(0.0, z0 * (1.0 - rearLock) + zFinal * rearLock));

          const zeta = Math.max(0.0, Math.min(1.0, (zFinal - (gz - rDepth)) / rDepth));
          const toroid = zeta > 0.0 ? Math.pow(Math.sin(0.85 * Math.PI * zeta), 1.10) : 0.0;
          const localPress = Math.max(0.0, (zEq - zKnee) / 18.0);
          const wFront = 1.0 - 0.85 * uUnder;

          const dxh = x0, dyh = y0 + 6.0;
          const wHeadZ = smoothstep(8.0, 36.0, z0) * wFront;
          const earTaper = 1.0 - 0.60 * smoothstep(50.0, 74.0, Math.abs(x0)) * smoothstep(18.0, 35.0, y0);
          const noseTopGuard = 1.0 - 0.65 * smoothstep(78.0, 96.0, z0) * smoothstep(-28.0, -10.0, y0);
          const headGain = (0.08 * normSnout + 0.21 * normHead + 0.10 * Math.min(1.4, localPress)) * state.bulge * wHeadZ * earTaper * (0.45 + 0.55 * toroid);
          const noseCoreMask = smoothstep(86.0, 102.0, z0) * smoothstep(-44.0, -34.0, y0) * (1.0 - smoothstep(24.0, 36.0, Math.abs(x0)));
          const latNoseScale = 1.0 - 0.42 * noseCoreMask;

          let dx = dxh * headGain * latNoseScale;
          let dy = dyh * (headGain * 0.66 * noseTopGuard);

          const dxn = x0, dyn = y0 + 25.0;
          const rn = Math.hypot(dxn / 38.0, dyn / 28.0);
          const wSnoutZ = smoothstep(42.0, 76.0, z0) * (1.0 - smoothstep(-4.0, 6.0, y0)) * wFront;
          const noseGain = Math.min(0.18, 0.10 * normSnout * state.bulge) * Math.exp(-0.45 * rn * rn) * wSnoutZ * (1.0 - 0.45 * noseCoreMask);
          const rimBell = rn > 1e-4 ? rn * Math.exp(0.5 - 0.5 * rn * rn) : 0.0;
          const tShift = rAmp * 0.36 * normSnout * toroid * rimBell * wSnoutZ;
          const ux = rn > 1e-5 ? dxn / (rn * 38.0) : 0.0;
          const uy = rn > 1e-5 ? dyn / (rn * 28.0) : 0.0;
          const uyTor = uy * (uy > 0.0 ? 0.10 : 0.62);
          dx += dxn * noseGain + ux * tShift;
          dy += dyn * (noseGain * (dyn > 0.0 ? 0.28 : 0.65)) + uyTor * tShift;

          const cheekZone = smoothstep(22.0, 56.0, z0) * smoothstep(-60.0, -40.0, y0) * (1.0 - smoothstep(-2.0, 12.0, y0)) * wFront;
          const cheekLat = Math.sin(Math.max(-1.0, Math.min(1.0, x0 / 56.0)) * 0.5 * Math.PI);
          dx += state.cheekPuff * 0.65 * state.bulge * (0.60 * normSnout + 0.45 * normHead) * cheekZone * cheekLat * (0.55 + 0.45 * toroid);

          const jowlMask = smoothstep(38.0, 72.0, z0) * smoothstep(-14.0, -34.0, y0) * (1.0 - 0.30 * smoothstep(44.0, 65.0, Math.abs(x0))) * wFront;
          dy -= state.jowlSag * 0.52 * state.bulge * (0.55 * normSnout + 0.35 * normHead) * jowlMask;

          const whiskerMask = smoothstep(46.0, 54.0, Math.abs(x0)) * smoothstep(-54.0, -46.0, y0) * (1.0 - smoothstep(-32.0, -24.0, y0)) * smoothstep(78.0, 90.0, z0);
          if (whiskerMask > 1e-4) {
            const excess = Math.abs(x0) - 46.0;
            const sx = x0 >= 0.0 ? 1.0 : -1.0;
            dx -= sx * (0.58 * excess) * whiskerMask;
            zFinal -= 3.2 * (excess / 20.0) * whiskerMask;
          }

          const fx = x0 + dx * rearLock;
          const fy = y0 + dy * rearLock;
          const fz = Math.max(0.0, Math.min(gz, zFinal));
          defPos[i*3] = fx; defPos[i*3+1] = fy; defPos[i*3+2] = fz;
          if (fx < minX) minX = fx; if (fx > maxX) maxX = fx;
          if (fy < minY) minY = fy; if (fy > maxY) maxY = fy;
          if (fz > maxZ) maxZ = fz;
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();

        // Dynamic Walnut Shadow-Box Frame (proud front molding + recessed clear glass)
        const bx0 = Math.min(-96, minX - 10), bx1 = Math.max(96, maxX + 10);
        const by0 = Math.min(-64, minY - 10), by1 = Math.max(62, maxY + 10);
        const cx = (bx0 + bx1) * 0.5, cy = (by0 + by1) * 0.5;
        const innerW = Math.max((bx1 - bx0) + 44, 236);
        const innerH = Math.max((by1 - by0) + 46, innerW * 0.72);
        const fw = innerW, fh = innerH;
        const wallThick = 15.0;
        const glassOutZ = gz + 2.5;
        const frameFrontZ = glassOutZ + 5.8;
        const frameDepth = frameFrontZ + 4.0;
        const railCz = (frameFrontZ - 4.0) * 0.5;

        backPlate.scale.set(fw + 4, fh + 4, 3.6);
        backPlate.position.set(cx, cy, -1.8);

        wallTop.scale.set(fw + wallThick * 2, wallThick, frameDepth);
        wallTop.position.set(cx, cy + fh * 0.5 + wallThick * 0.5, railCz);

        wallBottom.scale.set(fw + wallThick * 2, wallThick, frameDepth);
        wallBottom.position.set(cx, cy - fh * 0.5 - wallThick * 0.5, railCz);

        wallLeft.scale.set(wallThick, fh, frameDepth);
        wallLeft.position.set(cx - fw * 0.5 - wallThick * 0.5, cy, railCz);

        wallRight.scale.set(wallThick, fh, frameDepth);
        wallRight.position.set(cx + fw * 0.5 + wallThick * 0.5, cy, railCz);

        const rw = 2.6, rd = 3.2, rz = glassOutZ + rd * 0.5;
        rabbetTop.scale.set(fw, rw, rd);
        rabbetTop.position.set(cx, cy + fh * 0.5 - rw * 0.5, rz);
        rabbetBottom.scale.set(fw, rw, rd);
        rabbetBottom.position.set(cx, cy - fh * 0.5 + rw * 0.5, rz);
        rabbetLeft.scale.set(rw, fh - rw * 2, rd);
        rabbetLeft.position.set(cx - fw * 0.5 + rw * 0.5, cy, rz);
        rabbetRight.scale.set(rw, fh - rw * 2, rd);
        rabbetRight.position.set(cx + fw * 0.5 - rw * 0.5, cy, rz);

        // Natural oak shelf underneath frame
        const oy0 = cy - fh * 0.5 - wallThick;
        oakShelf.scale.set(fw * 2.2, 18.0, 180.0);
        oakShelf.position.set(cx, oy0 - 9.0, 50.0);

        // Front Glass Pane
        glassGroup.visible = state.showGlass;
        glassPane.scale.set(fw, fh, 1);
        glassEdges.scale.set(fw, fh, 1);
        glassGroup.position.set(cx, cy, gz + 0.5);

        document.getElementById('dimsReadout').textContent =
          `${(maxX - minX).toFixed(0)} × ${(maxY - minY).toFixed(0)} × ${maxZ.toFixed(1)} mm`;
        document.getElementById('contactBadge').textContent = `Glass Z: ${gz.toFixed(1)} mm`;
      }

      const PRESETS = {
        boop:    { glassZ: 50.0, bulge: 0.90, rollover: 6.5,  cheekPuff: 8.0,  jowlSag: 4.0,  preload: 0.85 },
        classic: { glassZ: 34.0, bulge: 1.45, rollover: 9.5,  cheekPuff: 14.0, jowlSag: 7.0,  preload: 0.92 },
        pancake: { glassZ: 27.0, bulge: 1.75, rollover: 11.0, cheekPuff: 18.0, jowlSag: 8.5,  preload: 0.95 },
        extreme: { glassZ: 22.0, bulge: 2.15, rollover: 14.0, cheekPuff: 22.0, jowlSag: 11.5, preload: 0.98 },
      };

      const sliders = [
        ['glassZ', 'glassZVal', v => `${v.toFixed(1)} mm`],
        ['bulgeFactor', 'bulgeFactorVal', v => `${v.toFixed(2)}x`, 'bulge'],
        ['rolloverBulge', 'rolloverBulgeVal', v => v.toFixed(1), 'rollover'],
        ['cheekPuff', 'cheekPuffVal', v => v.toFixed(1), 'cheekPuff'],
        ['jowlSag', 'jowlSagVal', v => v.toFixed(1), 'jowlSag'],
        ['preloadScale', 'preloadScaleVal', v => v.toFixed(2), 'preload'],
      ];

      function syncUI() {
        for (const [id, valId, fmt, key] of sliders) {
          const k = key || id;
          document.getElementById(id).value = state[k];
          document.getElementById(valId).textContent = fmt(state[k]);
        }
      }

      for (const [id, valId, fmt, key] of sliders) {
        const k = key || id;
        document.getElementById(id).addEventListener('input', (e) => {
          state[k] = parseFloat(e.target.value);
          document.getElementById(valId).textContent = fmt(state[k]);
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          updateScene();
        });
      }

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          Object.assign(state, PRESETS[btn.dataset.preset]);
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          syncUI();
          updateScene();
        });
      });

      document.getElementById('toggleGlass').addEventListener('change', (e) => {
        state.showGlass = e.target.checked;
        glassGroup.visible = state.showGlass;
      });

      document.getElementById('camFront').addEventListener('click', () => {
        camera.position.set(0, -4, 480);
        controls.target.set(0, -10, 16);
        controls.update();
      });
      document.getElementById('camAngle').addEventListener('click', () => {
        camera.position.set(175, 45, 440);
        controls.target.set(0, -12, 16);
        controls.update();
      });
      document.getElementById('camSide').addEventListener('click', () => {
        camera.position.set(440, 10, 65);
        controls.target.set(0, -12, 16);
        controls.update();
      });

      document.getElementById('copyBtn').addEventListener('click', async () => {
        const txt = `glass_plane_z=${state.glassZ}, squish_bulge_factor=${state.bulge}, rollover_bulge_mm=${state.rollover}, cheek_puff_mm=${state.cheekPuff}, jowl_sag_mm=${state.jowlSag}, z_preload_scale=${state.preload}`;
        try {
          await navigator.clipboard.writeText(txt);
          const b = document.getElementById('copyBtn');
          b.textContent = 'Copied!';
          setTimeout(() => b.textContent = 'Copy Settings', 1500);
        } catch {
          prompt('Copy these settings:', txt);
        }
      });

      function resize() {
        const vp = canvas.parentElement;
        const w = vp.clientWidth || window.innerWidth;
        const h = vp.clientHeight || 380;
        camera.aspect = w / h;
        // Adjust Z distance gracefully on narrow portrait phones so frame fits horizontally
        camera.fov = w < h ? 46 : 34;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      new ResizeObserver(resize).observe(canvas.parentElement);
      window.addEventListener('resize', resize);

      syncUI();
      updateScene();
      resize();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    } catch (err) {
      showErr('Three.js error: ' + err.message);
    }
  </script>
</body>
</html>
